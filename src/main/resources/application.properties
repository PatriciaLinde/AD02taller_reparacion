spring.application.name=apireparaciones
#configuracion mysql
spring.datasource.url=jdbc:mysql://localhost:3306/taller_reparacion
spring.datasource.username=root
spring.datasource.driver.class_name=com.mysql.cj.jdbc.driver


#Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Para ver las SQL que se ejecutan poner las siguientes (opcional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true